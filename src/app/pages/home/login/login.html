<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header mb-4">
        <h2>{{ appTitle }} Application Login</h2>
      </div>

      <ng-container *ngIf="loginError">
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ loginError }}
          <button type="button" class="btn-close" (click)="dismissError()"></button>
        </div>
      </ng-container>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="email"
            formControlName="email"
            [class.is-invalid]="submitted && f['email'].errors"
            placeholder="user@example.com"
            tabindex="1"
            autocomplete="username"
            [disabled]="isLoading"
          />
          <div class="invalid-feedback" *ngIf="submitted && f['email'].errors">
            <span *ngIf="f['email'].errors['required']">Email is required</span>
            <span *ngIf="f['email'].errors['email']">Email is invalid</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            formControlName="password"
            [class.is-invalid]="submitted && f['password'].errors"
            placeholder="Enter your password"
            tabindex="2"
            autocomplete="current-password"
            [disabled]="isLoading"
          />
          <div class="invalid-feedback" *ngIf="submitted && f['password'].errors">
            <span *ngIf="f['password'].errors['required']">Password is required</span>
            <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <!-- CAPTCHA section - currently hidden -->
        <div class="mb-3" *ngIf="showCaptcha">
          <label for="captcha" class="form-label">CAPTCHA</label>
          <input
            type="text"
            class="form-control"
            id="captcha"
            formControlName="captcha"
            placeholder="Enter the text you see above"
            [disabled]="isLoading"
          />
        </div>

        <div class="d-grid gap-2">
          <button 
            type="submit" 
            class="btn btn-success" 
            tabindex="3"
            [disabled]="isLoading"
          >
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            {{ isLoading ? 'Logging in...' : 'Login' }}
          </button>
        </div>
      </form>

      <div class="login-footer mt-4 p-3 bg-light rounded">
        <p class="small mb-2"><strong>Demo Credentials:</strong></p>
        <p class="small mb-1">Admin: <code>admin@example.com</code> / <code>admin123</code></p>
        <p class="small">User: <code>user@example.com</code> / <code>user123</code></p>
      </div>
    </div>
  </div>
</div>
