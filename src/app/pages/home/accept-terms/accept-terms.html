<form [formGroup]="acceptForm" (ngSubmit)="onSubmit()">
  <div>
    <div class="center">
      <div class="myImage" style="display: none;">
        <div class="center">
          <img ngSrc="images/loading.GIF" alt="Loading" width="32" height="32"/>
        </div>
      </div>
      <div class="myControls">
        <table class="clean-table">
          <tr>
            <td>
              @if (isLoading) {
                <div class="text-center">
                  <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading EULA...</span>
                  </div>
                </div>
              }
              @if (!isLoading && eulaText) {
                <div style="margin-top: 15px; margin-bottom: 15px;" [innerHTML]="eulaText" class="eula-text"></div>
              }
            </td>
          </tr>
          <tr>
            <td>
              <div class="center"><input id="btnAcceptTerms" value="Accept Terms" type="submit" class="btn btn-success BoldMe"/></div>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</form>
