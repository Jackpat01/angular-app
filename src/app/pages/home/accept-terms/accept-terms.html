<form (ngSubmit)="onSubmit()" [formGroup]="acceptForm">
  <div>
    <div class="center">
      <div class="myImage" style="display: none;">
        <div class="center">
          <img alt="Loading" height="32" ngSrc="images/loading.GIF" width="32"/>
        </div>
      </div>
      <div class="myControls">
        <table class="clean-table">
          <tr>
            <td>
              @if (isLoading) {
                <div class="text-center">
                  <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading EULA...</span>
                  </div>
                </div>
              }
              @if (!isLoading && eulaText) {
                <div [innerHTML]="eulaText" class="eula-text" style="margin-top: 15px; margin-bottom: 15px;"></div>
              }
            </td>
          </tr>
          <tr>
            <td>
              <div class="center"><input class="btn btn-success BoldMe" id="btnAcceptTerms" type="submit"
                                         value="Accept Terms"/></div>
            </td>
          </tr>
        </table>
      </div>
    </div>
  </div>
</form>
