<div class="accept-terms-wrapper">
  <div class="accept-terms-container">
    <div class="accept-terms-card">
      <div class="accept-terms-header mb-4">
        <h2>{{ appTitle }} - Terms of Use</h2>
      </div>

      <ng-container *ngIf="acceptError">
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          {{ acceptError }}
          <button type="button" class="btn-close" (click)="dismissError()"></button>
        </div>
      </ng-container>

      <div class="eula-content mb-4">
        <ng-container *ngIf="isLoading">
          <div class="text-center">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading EULA...</span>
            </div>
          </div>
        </ng-container>
        <ng-container *ngIf="!isLoading && eulaText">
          <div [innerHTML]="eulaText" class="eula-text"></div>
        </ng-container>
      </div>

      <form [formGroup]="acceptForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="acceptCheckbox"
              formControlName="acceptCheckbox"
              [disabled]="isLoading"
            />
            <label class="form-check-label" for="acceptCheckbox">
              I accept the Terms of Use
            </label>
            <div class="invalid-feedback d-block" *ngIf="submitted && f['acceptCheckbox'].errors">
              You must accept the Terms of Use to continue
            </div>
          </div>
        </div>

        <div class="d-grid gap-2 mb-2">
          <button 
            type="submit" 
            class="btn btn-success" 
            [disabled]="isLoading"
          >
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            {{ isLoading ? 'Processing...' : 'Accept Terms' }}
          </button>
        </div>

        <div class="text-center">
          <p class="text-muted small">By accepting, you agree to our Terms of Use and Privacy Policy</p>
        </div>
      </form>
    </div>
  </div>
</div>
