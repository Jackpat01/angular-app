<div class="admin-dashboard">
  <div class="row">
    <div class="col-md-12">
      <h4 class="mb-4">Dashboard Overview</h4>
    </div>
  </div>

  <!-- Statistics Cards -->
  <div class="row mb-4">
    <div *ngFor="let stat of stats" class="col-md-6 col-lg-3 mb-3">
      <div class="card stat-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <p class="text-muted mb-1">{{ stat.label }}</p>
              <h3 class="mb-0">{{ stat.value }}</h3>
            </div>
            <div class="stat-icon">
              <i class="bi bi-{{ stat.icon }}"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Recent Activity -->
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header bg-light">
          <h5 class="mb-0">Recent Activity</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
              <tr>
                <th>Action</th>
                <th>User</th>
                <th>Timestamp</th>
              </tr>
              </thead>
              <tbody>
              <tr *ngFor="let activity of recentActivity">
                <td>
                  <span class="badge bg-info">{{ activity.action }}</span>
                </td>
                <td>{{ activity.user }}</td>
                <td>{{ activity.timestamp }}</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
