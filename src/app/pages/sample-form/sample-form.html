<div class="row">
  <div class="col-md-8 offset-md-2">
    <ngb-alert [dismissible]="false" class="mb-4" type="info">
      <strong>Welcome!</strong> Fill out this form to get in touch with us.
    </ngb-alert>

    <div class="card">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Contact Form</h5>
      </div>
      <div class="card-body">
        <form (ngSubmit)="onSubmit()" [formGroup]="contactForm">
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label" for="firstName">First Name</label>
              <input
                [class.is-invalid]="submitted && f['firstName'].errors"
                class="form-control"
                formControlName="firstName"
                id="firstName"
                type="text">
              <div *ngIf="submitted && f['firstName'].errors" class="invalid-feedback">
                <span *ngIf="f['firstName'].errors['required']">First name is required</span>
                <span *ngIf="f['firstName'].errors['minlength']">Minimum 2 characters</span>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="lastName">Last Name</label>
              <input
                [class.is-invalid]="submitted && f['lastName'].errors"
                class="form-control"
                formControlName="lastName"
                id="lastName"
                type="text">
              <div *ngIf="submitted && f['lastName'].errors" class="invalid-feedback">
                <span *ngIf="f['lastName'].errors['required']">Last name is required</span>
                <span *ngIf="f['lastName'].errors['minlength']">Minimum 2 characters</span>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input
              [class.is-invalid]="submitted && f['email'].errors"
              class="form-control"
              formControlName="email"
              id="email"
              type="email">
            <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
              <span *ngIf="f['email'].errors['required']">Email is required</span>
              <span *ngIf="f['email'].errors['email']">Please enter a valid email</span>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="phone">Phone (Optional)</label>
            <input
              [class.is-invalid]="submitted && f['phone'].errors"
              class="form-control"
              formControlName="phone"
              id="phone"
              type="tel">
            <div *ngIf="submitted && f['phone'].errors" class="invalid-feedback">
              Please enter a valid phone number
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="subject">Subject</label>
            <select
              [class.is-invalid]="submitted && f['subject'].errors"
              class="form-select"
              formControlName="subject"
              id="subject">
              <option value="">Select a subject</option>
              <option value="inquiry">General Inquiry</option>
              <option value="support">Support Request</option>
              <option value="feedback">Feedback</option>
              <option value="other">Other</option>
            </select>
            <div *ngIf="submitted && f['subject'].errors" class="invalid-feedback">
              Subject is required
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="message">Message</label>
            <textarea
              [class.is-invalid]="submitted && f['message'].errors"
              class="form-control"
              formControlName="message"
              id="message"
              rows="5"></textarea>
            <div *ngIf="submitted && f['message'].errors" class="invalid-feedback">
              <span *ngIf="f['message'].errors['required']">Message is required</span>
              <span *ngIf="f['message'].errors['minlength']">Minimum 10 characters</span>
            </div>
          </div>

          <div class="mb-3 form-check">
            <input
              class="form-check-input"
              formControlName="subscribe"
              id="subscribe"
              type="checkbox">
            <label class="form-check-label" for="subscribe">
              Subscribe to our newsletter
            </label>
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Submit</button>
            <button (click)="reset()" class="btn btn-secondary" type="button">Reset</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
