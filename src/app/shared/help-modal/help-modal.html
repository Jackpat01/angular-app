<div class="modal fade" id="window_HelpNumber" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Need Assistance?</h3>
        <button class="close" data-bs-dismiss="modal" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <div>
          Please contact Customer Support at {{ supportEmail }}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" data-bs-dismiss="modal" type="button">Close</button>
      </div>
    </div>
  </div>
</div>

<a (click)="showHelpModal()" style="cursor: pointer; padding-right: 10px;">
  <img alt="Need Help?" height="40" src="assets/help.png" style="border-radius: 8px;" title="Need Help?" width="40"/>
</a>
