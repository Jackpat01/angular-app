<app-loading-overlay [isLoading]="isLoading"></app-loading-overlay>

<input id="logoutURL" type="hidden" value="/logout" />
<input id="hdnHeartBeat" type="hidden" value="/api/heartbeat" />

<div class="page-layout">
  <app-header-bar></app-header-bar>
  <app-logo-branding 
    [showUserInfo]="true"
    [userEmail]="userEmail"
    [userRole]="userRole"
    [providerType]="providerType"
    [projectName]="projectName">
  </app-logo-branding>
  
  <div class="d-flex">
    <div id="cssmenu" class="d-flex justify-content-between flex-grow-1">
      <ul style="list-style: none; padding: 0; margin: 0; display: flex;">
        <li style="padding: 10px 15px; border-right: 1px solid #ddd;">
          <a href="javascript:void(0);" (click)="logout()" style="color: #333; text-decoration: none;">
            Log Out
          </a>
        </li>
      </ul>
    </div>
    <div style="border-bottom: 2px solid #74c141;" class="d-flex align-items-center pl-1">
      <app-help-modal></app-help-modal>
    </div>
  </div>
</div>

<div id="contentPanel" style="width: 1280px; margin-left: auto; margin-right: auto;">
  <div class="container">
    <div class="clearFixedFloatingDiv"></div>
  </div>
  <div class="row">
    <div class="col-md-3 mb-4">
      <app-admin-navigation [menuItems]="menuItems"></app-admin-navigation>
    </div>
    <div class="col-md-9">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<app-footer-section [appVersion]="appVersion" [currentYear]="currentYear"></app-footer-section>

<noscript>
  <div>
    <h2>This site requires JavaScript</h2>
  </div>
</noscript>
