<ohfi-loading-overlay [isLoading]="isLoading"></ohfi-loading-overlay>

<input id="logoutURL" type="hidden" value="/logout"/>
<input id="hdnHeartBeat" type="hidden" value="/api/heartbeat"/>

<div class="page-layout">
  <ohfi-header-bar></ohfi-header-bar>
  <ohfi-logo-branding
    [projectName]="projectName"
    [providerType]="providerType"
    [showUserInfo]="true"
    [userEmail]="userEmail"
    [userRole]="userRole">
  </ohfi-logo-branding>

  <div class="d-flex">
    <div class="d-flex justify-content-between flex-grow-1" id="cssmenu">
      <ul style="list-style: none; padding: 0; margin: 0; display: flex;">
        <li style="padding: 10px 15px; border-right: 1px solid #ddd;">
          <a (click)="logout()" href="javascript:void(0);" style="color: #333; text-decoration: none;">
            Log Out
          </a>
        </li>
      </ul>
    </div>
    <div class="d-flex align-items-center pl-1" style="border-bottom: 2px solid #74c141;">
      <ohfi-help-modal></ohfi-help-modal>
    </div>
  </div>
</div>

<div id="contentPanel" style="width: 1280px; margin-left: auto; margin-right: auto;">
  <div class="container">
    <div class="clearFixedFloatingDiv"></div>
  </div>
  <div class="row">
    <div class="col-md-3 mb-4">
      <ohfi-admin-navigation [menuItems]="menuItems"></ohfi-admin-navigation>
    </div>
    <div class="col-md-9">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<ohfi-footer-section [appVersion]="appVersion" [currentYear]="currentYear"></ohfi-footer-section>

<noscript>
  <div>
    <h2>This site requires JavaScript</h2>
  </div>
</noscript>
